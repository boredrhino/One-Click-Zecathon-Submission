[package]
name = "once-keys"
version = "0.1.0"
edition = "2021"
description = "One Orchard unified address per seed, for the Once ZECATHON entry."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bip39 = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zcash_keys = "0.17"
zcash_protocol = "0.11"
zip32 = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
lto = false
codegen-units = 16
opt-level = 2
